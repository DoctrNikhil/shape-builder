name: PR Preview Deployment

on:
  workflow_run:
    workflows: ["Build PR Preview"]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: preview-deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  PREVIEW_RETENTION_LIMIT: 6

jobs:
  read-metadata:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      pr-number: ${{ steps.pr.outputs.PULL_REQUEST }}
      action: ${{ steps.pr.outputs.ACTION }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Download build artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: shape-builder-preview
          path: shape-builder-preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Retrieve PR metadata
        id: pr
        shell: bash
        run: |
          number=$(head -n1 shape-builder-preview/pr/number | tr -d '[:space:]')
          case "$number" in
            ''|*[!0-9]*) echo "::error::invalid PR number"; exit 1 ;;
          esac

          action=$(head -n1 shape-builder-preview/pr/action | tr -d '[:space:]')
          case "$action" in
            opened|reopened|synchronize|closed) ;;
            *) echo "::error::invalid action: $action"; exit 1 ;;
          esac

          echo "PULL_REQUEST=$number" >> "$GITHUB_OUTPUT"
          echo "ACTION=$action" >> "$GITHUB_OUTPUT"

  deploy:
    needs: read-metadata
    runs-on: ubuntu-24.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout trusted base branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: master
          persist-credentials: true

      - name: Download build artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: shape-builder-preview
          path: shape-builder-preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy PR preview
        id: preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: ./shape-builder-preview/site/public
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: ${{ needs.read-metadata.outputs.action == 'closed' && 'remove' || 'deploy' }}
          pr-number: ${{ needs.read-metadata.outputs.pr-number }}
          comment: false
          qr-code: false

      - name: Comment PR with preview status
        uses: marocchino/sticky-pull-request-comment@67d0dec7b07ed060a405f9b2a64b8ab319fdd7db # v2.9.2
        with:
          header: pr-preview
          number: ${{ needs.read-metadata.outputs.pr-number }}
          message: |
            ${{ needs.read-metadata.outputs.action == 'closed'
              && 'Preview removed because the pull request was closed.'
              || format('Preview deployment: {0}', steps.preview.outputs.preview-url) }}

  prune:
    needs: read-metadata
    if: needs.read-metadata.outputs.action != 'closed'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout gh-pages for preview retention
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: gh-pages
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            pr-preview
          path: gh-pages-maintenance

      - name: Prune old PR previews
        id: prune-previews
        continue-on-error: true
        shell: bash
        run: |
          cd gh-pages-maintenance
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "removed_prs_json=[]" >> "$GITHUB_OUTPUT"
          attempts=5
          removed_prs=()

          for attempt in $(seq 1 "$attempts"); do
            git fetch --quiet origin gh-pages
            git reset --quiet --hard FETCH_HEAD
            mkdir -p pr-preview

            mapfile -t previews < <(
              while IFS= read -r preview; do
                timestamp="$(git log -1 --format=%ct -- "pr-preview/$preview" 2>/dev/null || echo 0)"
                printf '%s %s\n' "$timestamp" "$preview"
              done < <(find pr-preview -mindepth 1 -maxdepth 1 -type d -name 'pr-*' -printf '%f\n') \
                | sort -nr \
                | awk '{print $2}'
            )

            removed_prs=()
            if (( ${#previews[@]} > PREVIEW_RETENTION_LIMIT )); then
              for preview in "${previews[@]:PREVIEW_RETENTION_LIMIT}"; do
                rm -rf "pr-preview/$preview"
                removed_prs+=("${preview#pr-}")
              done
            fi

            if git diff --quiet -- pr-preview; then
              break
            fi

            git add pr-preview
            git commit --quiet -m "Prune old PR previews"
            if git push origin HEAD:gh-pages; then
              break
            fi

            echo "Prune push lost the race (attempt ${attempt}/${attempts}); retrying."
            sleep "$(( attempt * 5 ))"
          done

          if [ "${#removed_prs[@]}" -gt 0 ]; then
            echo "removed_prs_json=$(printf '%s\n' "${removed_prs[@]}" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on pruned previews
        if: steps.prune-previews.outputs.removed_prs_json != '[]'
        uses: actions/github-script@v8
        env:
          REMOVED_PRS_JSON: ${{ steps.prune-previews.outputs.removed_prs_json }}
          PREVIEW_RETENTION_LIMIT: ${{ env.PREVIEW_RETENTION_LIMIT }}
        with:
          script: |
            const removedPrs = JSON.parse(process.env.REMOVED_PRS_JSON);
            const retentionLimit = process.env.PREVIEW_RETENTION_LIMIT;
            const marker = "<!-- Sticky Pull Request Commentpr-preview -->";

            for (const prNumber of removedPrs) {
              const body =
                `Preview deployment for PR #${prNumber} removed.\n\n` +
                `Only the ${retentionLimit} most recently updated previews are retained.\n\n` +
                `Push a new commit to generate a fresh preview.\n` +
                marker;

              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(prNumber),
                per_page: 100,
              });

              const existing = [...comments].reverse().find((comment) =>
                comment.user?.login === "github-actions[bot]" &&
                comment.body?.includes(marker)
              );

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: Number(prNumber),
                  body,
                });
              }
            }
